function chartMarkup(values){
  const xs=[43,153,263,373,483], top=34,bottom=195;
  const min=Math.max(1,Math.min(...values)-15),max=Math.min(195,Math.max(...values)+15);
  const y=v=>top+(v-min)/(max-min||1)*(bottom-top);
