for(let i=shuffledPreviewSongs.length-1;i>0;i--){
 const j=Math.floor(Math.random()*(i+1));
 [shuffledPreviewSongs[i],shuffledPreviewSongs[j]]=[shuffledPreviewSongs[j],shuffledPreviewSongs[i]];
}
shuffledPreviewSongs.forEach(item=>{const option=document.createElement('option');option.value=item.song;songList.append(option)});
function previewPrevious(item){const p=item.previous;if(!p||p==='미확인')return '이번 총선에서 새롭게 진입했어요!';const n=Number(p);return `지난 4월 총선 ${n}위 (${n>item.rank?`${n-item.rank}계단 상승`:n<item.rank?`${item.rank-n}계단 하락`:'순위 유지'})`}
function previewChange(item){const p=item.previous;if(!p||p==='미확인')return '이번 총선에서 새롭게 진입';const n=Number(p);return n>item.rank?`${n-item.rank}계단 상승`:n<item.rank?`${item.rank-n}계단 하락`:'순위 유지'}
function setPreviewChoice(item){
 previewChoice=item;previewInput.value=item.song;previewInput.disabled=true;previewForm.querySelector('button').disabled=true;
 previewResult.className='preview-result';previewResult.replaceChildren();
 const card=document.createElement('div');card.className='preview-result-card';
 const rank=document.createElement('div');rank.className='preview-result-rank';rank.textContent=item.rank;
 const info=document.createElement('div');info.className='preview-result-info';
 const name=document.createElement('div');name.className='preview-result-title';name.textContent=item.song;
 const prev=document.createElement('div');prev.className='preview-result-previous';prev.textContent=previewPrevious(item);
 const total=document.createElement('div');total.className='preview-result-total';const strong=document.createElement('strong');strong.textContent=item.total.toLocaleString('ko-KR');total.append(strong,document.createTextNode(' 점'));
 info.append(name,prev);card.append(rank,info,total);previewResult.append(card);
 previewShare.hidden=false;previewBottom.textContent='다른 곡 순위 보러가기! (클릭)';
}
function showPreviewMessage(message,error=false){previewResult.className='preview-result '+(error?'is-error':'is-message');previewResult.textContent=message}
function openPreview(){
 previewBackdrop.hidden=false;previewReopen.hidden=true;document.body.classList.add('preview-locked');
 if(previewChoice)setPreviewChoice(previewChoice);
 else{previewInput.disabled=false;previewForm.querySelector('button').disabled=false;previewInput.value='';showPreviewMessage('검색중입니다...');previewShare.hidden=true;previewBottom.textContent='이벤트에 참여하지 않고 나중에 알고 싶어요! (클릭)'}
}
function closePreview(){previewBackdrop.hidden=true;document.body.classList.remove('preview-locked');previewReopen.hidden=false}
previewForm.addEventListener('submit',event=>{
 event.preventDefault();if(previewChoice)return;
 const term=normalizeSong(previewInput.value);if(!term){showPreviewMessage('곡 제목을 입력해 주세요.',true);return}
 const exact=previewSongs.filter(item=>normalizeSong(item.song)===term);
 const matches=exact.length?exact:previewSongs.filter(item=>normalizeSong(item.song).includes(term));
 if(matches.length===0){showPreviewMessage('조회할 수 없는 곡이에요. 제목을 다시 확인해 주세요.',true);return}
 if(matches.length>1){showPreviewMessage('여러 곡이 검색됐어요. 정확한 곡 제목을 입력해 주세요.',true);return}
 const item=matches[0];
 try{localStorage.setItem(previewKey,String(item.rank))}catch(e){showPreviewMessage('참여 기록을 저장할 수 없어요. 브라우저 설정을 확인해 주세요.',true);return}
 setPreviewChoice(item);
 render(activeCategory);
});
previewShare.addEventListener('click',()=>{
 if(!previewChoice)return;
 const item=previewChoice;
 const message=`💎 2026 셉카이브 배 세븐틴 전곡 총선
: 원하는 한 곡 순위 미리보기 이벤트!

🎵 ${item.song}
🏆 최종 순위 : ${item.rank}위
📈 지난 4월 총선 대비 : ${previewChange(item)}

순위 보고 이벤트 참여하기
https://tinyurl.com/2026SVTresult01`;
 window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(message),'_blank','noopener,noreferrer');
});
previewBottom.addEventListener('click',closePreview);
previewReopen.addEventListener('click',openPreview);
try{const saved=localStorage.getItem(previewKey);if(saved)previewChoice=previewSongs.find(x=>x.rank===Number(saved))||null}catch(e){}
openPreview();
</script></body></html>
